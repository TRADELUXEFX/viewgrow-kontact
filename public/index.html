<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kontact — Access console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8fafc;
    --bg-soft: #ffffff;
    --surface: #ffffff;
    --surface-hi: #f8fafc;
    --border: #e2e8f0;
    --border-hi: #cbd5e1;
    --text: #0f172a;
    --text-dim: #64748b;
    --text-faint: #94a3b8;
    --amber: #059669;
    --amber-hi: #047857;
    --amber-dim: #a7f3d0;
    --blue: #3b82f6;
    --green: #16a34a;
    --red: #dc2626;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .display { font-family: 'Space Grotesk', 'Inter', sans-serif; }
  code, .mono, .code-chip { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  a { color: var(--amber); text-decoration: none; }
  a:hover { color: var(--amber-hi); }

  svg.icon { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; vertical-align: -3px; }

  /* ---------- Login gate ---------- */
  #gate {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    padding: 20px;
  }
  #gate::before {
    content: '';
    position: absolute;
    width: 720px; height: 720px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(5,150,105,.08) 0%, rgba(5,150,105,0) 70%);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .gate-card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 32px 30px;
    text-align: center;
    box-shadow: 0 24px 60px -20px rgba(0,0,0,.6);
  }
  .keyhole {
    width: 44px; height: 44px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: linear-gradient(155deg, var(--amber), var(--amber-dim));
    display: flex; align-items: center; justify-content: center;
  }
  .keyhole svg { width: 20px; height: 20px; stroke: #ffffff; stroke-width: 2; }
  .gate-card h1 { font-size: 19px; margin: 0 0 6px; letter-spacing: -.01em; }
  .gate-card .sub { color: var(--text-dim); font-size: 13px; margin: 0 0 24px; line-height: 1.5; }
  .field { text-align: left; margin-bottom: 14px; }
  .field label { display: block; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--text-faint); margin-bottom: 7px; }
  input, select {
    width: 100%;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 11px 13px;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
  }
  input::placeholder { color: var(--text-faint); }
  input:focus, select:focus { outline: none; border-color: var(--amber-dim); box-shadow: 0 0 0 3px rgba(214,162,76,.12); }
  input[type="checkbox"] { width: auto; }

  button { font-family: inherit; border: none; border-radius: 8px; padding: 10px 16px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: background .12s, opacity .12s; }
  .btn-amber { background: var(--amber); color: #ffffff; }
  .btn-amber:hover { background: var(--amber-hi); }
  .btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--text); border-color: var(--border-hi); }
  .btn-danger { background: rgba(226,103,122,.12); color: var(--red); border: 1px solid rgba(226,103,122,.3); }
  .btn-danger:hover { background: rgba(226,103,122,.2); }
  .btn-blue { background: rgba(108,142,239,.14); color: var(--blue); border: 1px solid rgba(108,142,239,.3); }
  .btn-blue:hover { background: rgba(108,142,239,.22); }
  button:disabled { opacity: .5; cursor: default; }
  button.full { width: 100%; justify-content: center; }

  .gate-error { margin-top: 14px; font-size: 12.5px; color: var(--red); }

  /* ---------- App shell ---------- */
  #app { display: none; min-height: 100vh; }
  .shell { display: grid; grid-template-columns: 224px 1fr; min-height: 100vh; }
  aside {
    background: var(--bg-soft);
    border-right: 1px solid var(--border);
    padding: 22px 16px;
    display: flex;
    flex-direction: column;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; margin-bottom: 28px; }
  .brand .mark { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(155deg, var(--amber), var(--amber-dim)); display: flex; align-items: center; justify-content: center; }
  .brand .mark svg { width: 15px; height: 15px; stroke: #ffffff; stroke-width: 2.2; }
  .brand .name { font-size: 14.5px; font-weight: 600; letter-spacing: -.01em; }
  .brand .tag { font-size: 10.5px; color: var(--text-faint); }

  nav.nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: 8px;
    color: var(--text-dim); font-size: 13.5px; font-weight: 500;
    cursor: pointer; border: 1px solid transparent;
  }
  .nav-item:hover { background: var(--surface); color: var(--text); }
  .nav-item.active { background: var(--surface-hi); color: var(--text); border-color: var(--border); }
  .nav-item svg { color: var(--text-faint); }
  .nav-item.active svg { color: var(--amber); }

  .aside-foot { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); }
  .signout { display: flex; align-items: center; gap: 8px; color: var(--text-faint); font-size: 12.5px; cursor: pointer; padding: 8px; border-radius: 8px; }
  .signout:hover { color: var(--red); background: rgba(226,103,122,.08); }

  main { padding: 30px 34px 60px; overflow-y: auto; }
  .page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; gap: 16px; flex-wrap: wrap; }
  .page-head h2 { font-size: 20px; margin: 0 0 3px; letter-spacing: -.01em; }
  .page-head .sub { color: var(--text-dim); font-size: 13px; margin: 0; }

  .back { display: inline-flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 12.5px; cursor: pointer; margin-bottom: 18px; }
  .back:hover { color: var(--text); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
  .stat .num { font-family: 'Space Grotesk'; font-size: 26px; font-weight: 600; }
  .stat .lbl { font-size: 11.5px; color: var(--text-faint); margin-top: 3px; text-transform: uppercase; letter-spacing: .04em; }
  .stat.amber .num { color: var(--amber); }
  .stat.blue .num { color: var(--blue); }
  .stat.green .num { color: var(--green); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; margin-bottom: 18px; }
  .card h3 { font-size: 14px; margin: 0 0 16px; display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .card h3 svg { color: var(--amber); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 9px 12px; color: var(--text-faint); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--border); }
  td { padding: 11px 12px; border-bottom: 1px solid var(--border); color: var(--text); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface-hi); }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .row-actions button { padding: 6px 11px; font-size: 12px; }

  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge-amber { background: rgba(214,162,76,.14); color: var(--amber-hi); }
  .badge-gray { background: rgba(146,150,161,.12); color: var(--text-dim); }
  .badge-red { background: rgba(226,103,122,.14); color: var(--red); }
  .badge-green { background: rgba(86,185,140,.14); color: var(--green); }

  .code-chip { color: var(--amber); font-weight: 600; letter-spacing: .04em; font-size: 13px; }

  .field-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .empty { color: var(--text-faint); font-size: 13px; padding: 20px 0; text-align: center; }
  .empty a { color: var(--amber); }

  .banner { padding: 11px 15px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: flex; align-items: flex-start; gap: 8px; word-break: break-word; }
  .banner.err { background: rgba(226,103,122,.1); color: var(--red); border: 1px solid rgba(226,103,122,.25); }
  .banner.ok { background: rgba(86,185,140,.1); color: var(--green); border: 1px solid rgba(86,185,140,.25); }

  .sheet-link { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  ::selection { background: rgba(214,162,76,.3); }

  @media (max-width: 760px) {
    .shell { grid-template-columns: 1fr; }
    aside { flex-direction: row; align-items: center; padding: 14px 16px; overflow-x: auto; }
    .brand { margin-bottom: 0; margin-right: 12px; }
    nav.nav { flex-direction: row; }
    .aside-foot { display: none; }
    main { padding: 22px 18px 50px; }
  }
</style>
</head>
<body>

<!-- ============ ICON DEFS (referenced via <use>) ============ -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M10.5 12.5 20 3M17 6l3 3M14 9l2 2"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0-1 13a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 7"/><path d="M10 11v6M14 11v6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 19h14"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8M9 5H6a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 5H6a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h3M16 15l4-3-4-3M20 12H9"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3 5 13h6l-1 8 8-10h-6l1-8Z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/></symbol>
  </defs>
</svg>

<div id="gate">
  <div class="gate-card">
    <div class="keyhole"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><use href="#i-key"/></svg></div>
    <h1>Access console</h1>
    <p class="sub">Sign in with your admin secret to manage contact lists and codes.</p>
    <div class="field">
      <label>Admin secret</label>
      <input type="password" id="secretInput" placeholder="••••••••••••••">
    </div>
    <button class="btn-amber full" onclick="signIn()"><svg class="icon" viewBox="0 0 24 24"><use href="#i-lock"/></svg>Sign in</button>
    <p id="gateError" class="gate-error" style="display:none;"></p>
  </div>
</div>

<div id="app">
  <div class="shell">
    <aside>
      <div class="brand">
        <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><use href="#i-key"/></svg></div>
        <div>
          <div class="name">Kontact</div>
          <div class="tag">Access console</div>
        </div>
      </div>
      <nav class="nav">
        <div class="nav-item" data-nav="dashboard" onclick="setView('dashboard')"><svg class="icon" viewBox="0 0 24 24"><use href="#i-grid"/></svg>Dashboard</div>
        <div class="nav-item" data-nav="create" onclick="setView('create')"><svg class="icon" viewBox="0 0 24 24"><use href="#i-plus"/></svg>New list</div>
      </nav>
      <div class="aside-foot">
        <div class="signout" onclick="signOut()"><svg class="icon" viewBox="0 0 24 24"><use href="#i-logout"/></svg>Sign out</div>
      </div>
    </aside>
    <main id="main"></main>
  </div>
</div>

<script>
const SECRET_KEY = 'vk_admin_secret';
let secret = sessionStorage.getItem(SECRET_KEY);
let lists = [];
let view = { name: 'dashboard', listId: null };
let flash = null;

if (secret) showApp();

function signIn() {
  const val = document.getElementById('secretInput').value.trim();
  if (!val) return;
  secret = val;
  sessionStorage.setItem(SECRET_KEY, secret);
  document.getElementById('gateError').style.display = 'none';
  showApp();
}

function signOut() {
  sessionStorage.removeItem(SECRET_KEY);
  secret = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('gate').style.display = 'flex';
  document.getElementById('secretInput').value = '';
}

async function showApp() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  await loadLists(true);
}

async function api(path, opts = {}) {
  let res;
  try {
    res = await fetch(path, {
      ...opts,
      headers: { 'Content-Type': 'application/json', 'x-admin-secret': secret, ...(opts.headers || {}) },
    });
  } catch (networkErr) {
    throw new Error(`Network error calling ${path}: ${networkErr.message}`);
  }

  if (res.status === 401) {
    sessionStorage.removeItem(SECRET_KEY);
    secret = null;
    document.getElementById('app').style.display = 'none';
    document.getElementById('gate').style.display = 'flex';
    document.getElementById('gateError').textContent = 'That secret was rejected. Try again.';
    document.getElementById('gateError').style.display = 'block';
    throw new Error('unauthorized');
  }

  const rawText = await res.text();
  let data = {};
  try {
    data = rawText ? JSON.parse(rawText) : {};
  } catch {
    // Response wasn't JSON — likely a 404 HTML page (bad redirect) or a
    // function crash page. Surface enough to diagnose it.
    if (!res.ok) {
      throw new Error(`${path} → HTTP ${res.status}. Response wasn't JSON — first 120 chars: ${rawText.slice(0, 120)}`);
    }
  }

  if (!res.ok) {
    throw new Error(`${path} → HTTP ${res.status}: ${data.message || data.error || 'unknown error'}`);
  }
  return data;
}

async function loadLists(rerender) {
  try {
    lists = await api('/api/admin/lists');
    if (rerender) render();
  } catch (e) { if (e.message !== 'unauthorized') showFlash(e.message, true); }
}

function showFlash(msg, isError) {
  flash = { msg, isError };
  render();
  setTimeout(() => { flash = null; render(); }, 3500);
}

function setView(name, listId) {
  view = { name, listId: listId || null };
  render();
}

function bannerHtml() {
  if (!flash) return '';
  return `<div class="banner ${flash.isError ? 'err' : 'ok'}"><svg class="icon" viewBox="0 0 24 24"><use href="#${flash.isError ? 'i-alert' : 'i-check'}"/></svg>${escapeHtml(flash.msg)}</div>`;
}

function syncNav() {
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.nav === (view.name === 'edit' || view.name === 'codes' ? 'dashboard' : view.name));
  });
}

function render() {
  syncNav();
  const m = document.getElementById('main');

  if (view.name === 'dashboard') {
    const totalCodes = lists.reduce((a, l) => a + (l.codeStats ? l.codeStats.total : 0), 0);
    m.innerHTML = `
      ${bannerHtml()}
      <div class="page-head">
        <div>
          <h2>Contact lists</h2>
          <p class="sub">Lists and their access codes for the app.</p>
        </div>
        <button class="btn-amber" onclick="setView('create')"><svg class="icon" viewBox="0 0 24 24"><use href="#i-plus"/></svg>New list</button>
      </div>
      <div class="stats">
        <div class="stat"><div class="num">${lists.length}</div><div class="lbl">Lists</div></div>
        <div class="stat amber"><div class="num">${lists.filter(l => l.is_public).length}</div><div class="lbl">Public</div></div>
      </div>
      <div class="card">
        ${lists.length === 0
          ? `<p class="empty">No lists yet. <a onclick="setView('create')" style="cursor:pointer;">Create your first list →</a></p>`
          : `<table>
              <thead><tr><th>Name</th><th>Status</th><th>Sheet</th><th></th></tr></thead>
              <tbody>
                ${lists.map(l => `
                  <tr>
                    <td><strong>${escapeHtml(l.name)}</strong></td>
                    <td>${l.is_public ? '<span class="badge badge-amber">Public</span>' : '<span class="badge badge-gray">Hidden</span>'}</td>
                    <td><a class="sheet-link" href="${escapeAttr(l.sheet_url)}" target="_blank">View sheet <svg class="icon" viewBox="0 0 24 24" style="width:12px;height:12px;"><use href="#i-external"/></svg></a></td>
                    <td class="row-actions">
                      <button class="btn-blue" onclick="openCodes('${l.id}')"><svg class="icon" viewBox="0 0 24 24"><use href="#i-key"/></svg>Codes</button>
                      <button class="btn-ghost" onclick="openEdit('${l.id}')"><svg class="icon" viewBox="0 0 24 24"><use href="#i-pencil"/></svg>Edit</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>`
        }
      </div>
    `;
  }

  else if (view.name === 'create') {
    m.innerHTML = `
      ${bannerHtml()}
      <div class="back" onclick="setView('dashboard')"><svg class="icon" viewBox="0 0 24 24"><use href="#i-chevron-left"/></svg>Back</div>
      <div class="card" style="max-width:480px;">
        <h3><svg class="icon" viewBox="0 0 24 24"><use href="#i-plus"/></svg>Create contact list</h3>
        <form onsubmit="return createList(event)">
          <div class="field">
            <label>List name</label>
            <input type="text" id="f_name" placeholder="e.g. Lagos Business Network" required>
          </div>
          <div class="field">
            <label>Google Sheet URL</label>
            <input type="url" id="f_sheet" placeholder="https://docs.google.com/spreadsheets/d/..." required>
          </div>
          <div class="field" style="display:flex;align-items:center;gap:8px;">
            <input type="checkbox" id="f_public" checked>
            <label style="margin:0;text-transform:none;font-weight:400;color:var(--text-dim);letter-spacing:0;">Visible in app</label>
          </div>
          <button class="btn-amber" type="submit"><svg class="icon" viewBox="0 0 24 24"><use href="#i-check"/></svg>Create list</button>
        </form>
      </div>
    `;
  }

  else if (view.name === 'edit') {
    const l = lists.find(x => String(x.id) === String(view.listId));
    if (!l) { setView('dashboard'); return; }
    m.innerHTML = `
      ${bannerHtml()}
      <div class="back" onclick="setView('dashboard')"><svg class="icon" viewBox="0 0 24 24"><use href="#i-chevron-left"/></svg>Back</div>
      <div class="card" style="max-width:480px;">
        <h3><svg class="icon" viewBox="0 0 24 24"><use href="#i-pencil"/></svg>${escapeHtml(l.name)}</h3>
        <form onsubmit="return updateList(event, '${l.id}')">
          <div class="field">
            <label>List name</label>
            <input type="text" id="f_name" value="${escapeAttr(l.name)}" required>
          </div>
          <div class="field">
            <label>Google Sheet URL</label>
            <input type="url" id="f_sheet" value="${escapeAttr(l.sheet_url)}" required>
          </div>
          <div class="field" style="display:flex;align-items:center;gap:8px;">
            <input type="checkbox" id="f_public" ${l.is_public ? 'checked' : ''}>
            <label style="margin:0;text-transform:none;font-weight:400;color:var(--text-dim);letter-spacing:0;">Visible in app</label>
          </div>
          <div class="row-actions">
            <button class="btn-amber" type="submit"><svg class="icon" viewBox="0 0 24 24"><use href="#i-check"/></svg>Save changes</button>
            <button type="button" class="btn-blue" onclick="openCodes('${l.id}')"><svg class="icon" viewBox="0 0 24 24"><use href="#i-key"/></svg>Manage codes</button>
          </div>
        </form>
      </div>
      <div class="card" style="max-width:480px;border-color:rgba(226,103,122,.25);">
        <h3 style="color:var(--red);"><svg class="icon" viewBox="0 0 24 24" style="color:var(--red);"><use href="#i-trash"/></svg>Danger zone</h3>
        <p style="color:var(--text-dim);font-size:12.5px;margin:0 0 14px;">Deletes this list and every code that belongs to it. Cannot be undone.</p>
        <button class="btn-danger" onclick="deleteList('${l.id}')"><svg class="icon" viewBox="0 0 24 24"><use href="#i-trash"/></svg>Delete list</button>
      </div>
    `;
  }

  else if (view.name === 'codes') {
    const l = lists.find(x => String(x.id) === String(view.listId));
    if (!l) { setView('dashboard'); return; }
    const codes = view.codes || [];
    const used = codes.filter(c => c.is_used).length;
    m.innerHTML = `
      ${bannerHtml()}
      <div class="back" onclick="setView('dashboard')"><svg class="icon" viewBox="0 0 24 24"><use href="#i-chevron-left"/></svg>Back</div>
      <div class="page-head">
        <div>
          <h2>${escapeHtml(l.name)}</h2>
          <p class="sub">Access codes for this list.</p>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><div class="num">${codes.length}</div><div class="lbl">Total codes</div></div>
        <div class="stat green"><div class="num">${codes.length - used}</div><div class="lbl">Available</div></div>
        <div class="stat"><div class="num">${used}</div><div class="lbl">Used</div></div>
      </div>
      <div class="card">
        <h3><svg class="icon" viewBox="0 0 24 24"><use href="#i-bolt"/></svg>Generate codes</h3>
        <form class="field-row" onsubmit="return generateCodes(event, '${l.id}')">
          <div class="field" style="margin:0;">
            <label>Quantity</label>
            <input type="number" id="f_count" value="10" min="1" max="500" style="width:110px;">
          </div>
          <button class="btn-amber" type="submit"><svg class="icon" viewBox="0 0 24 24"><use href="#i-bolt"/></svg>Generate</button>
          <button type="button" class="btn-ghost" onclick="downloadCsv('${l.id}', '${escapeAttr(l.name)}')"><svg class="icon" viewBox="0 0 24 24"><use href="#i-download"/></svg>Download CSV</button>
        </form>
      </div>
      <div class="card">
        ${codes.length === 0
          ? `<p class="empty">No codes yet. Generate some above.</p>`
          : `<table>
              <thead><tr><th>Code</th><th>Status</th><th>Used at</th><th>Generated</th></tr></thead>
              <tbody>
                ${codes.map(c => `
                  <tr>
                    <td><span class="code-chip">${escapeHtml(c.code)}</span></td>
                    <td>${c.is_used ? '<span class="badge badge-red">Used</span>' : '<span class="badge badge-green">Available</span>'}</td>
                    <td>${c.used_at ? escapeHtml(new Date(c.used_at).toLocaleString()) : '—'}</td>
                    <td>${escapeHtml(new Date(c.created_at).toLocaleDateString())}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>`
        }
      </div>
    `;
  }
}

async function openEdit(id) { setView('edit', id); }

async function openCodes(id) {
  view = { name: 'codes', listId: id, codes: [] };
  render();
  try {
    const codes = await api(`/api/admin/codes?list_id=${encodeURIComponent(id)}`);
    view.codes = codes;
    render();
  } catch (e) { if (e.message !== 'unauthorized') showFlash(e.message, true); }
}

async function createList(e) {
  e.preventDefault();
  const name = document.getElementById('f_name').value.trim();
  const sheet_url = document.getElementById('f_sheet').value.trim();
  const is_public = document.getElementById('f_public').checked;
  try {
    await api('/api/admin/lists', { method: 'POST', body: JSON.stringify({ name, sheet_url, is_public }) });
    await loadLists(false);
    setView('dashboard');
    showFlash('List created.');
  } catch (e) { if (e.message !== 'unauthorized') showFlash(e.message, true); }
  return false;
}

async function updateList(e, id) {
  e.preventDefault();
  const name = document.getElementById('f_name').value.trim();
  const sheet_url = document.getElementById('f_sheet').value.trim();
  const is_public = document.getElementById('f_public').checked;
  try {
    await api('/api/admin/lists', { method: 'PUT', body: JSON.stringify({ id, name, sheet_url, is_public }) });
    await loadLists(false);
    setView('dashboard');
    showFlash('List updated.');
  } catch (e) { if (e.message !== 'unauthorized') showFlash(e.message, true); }
  return false;
}

async function deleteList(id) {
  if (!confirm('Delete this list and ALL its codes? This cannot be undone.')) return;
  try {
    await api('/api/admin/lists', { method: 'DELETE', body: JSON.stringify({ id }) });
    await loadLists(false);
    setView('dashboard');
    showFlash('List deleted.');
  } catch (e) { if (e.message !== 'unauthorized') showFlash(e.message, true); }
}

async function generateCodes(e, listId) {
  e.preventDefault();
  const count = parseInt(document.getElementById('f_count').value, 10) || 1;
  try {
    await api('/api/admin/codes', { method: 'POST', body: JSON.stringify({ list_id: listId, count }) });
    await openCodes(listId);
    showFlash(`${count} code(s) generated.`);
  } catch (e) { if (e.message !== 'unauthorized') showFlash(e.message, true); }
  return false;
}

async function downloadCsv(listId, listName) {
  try {
    const codes = await api(`/api/admin/codes?list_id=${encodeURIComponent(listId)}`);
    const rows = [['Code', 'Status', 'Used At', 'Created At']];
    codes.forEach(c => rows.push([c.code, c.is_used ? 'Used' : 'Available', c.used_at || '', c.created_at]));
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `kontact-codes-${listName.toLowerCase().replace(/[^a-z0-9]+/g, '-')}.csv`;
    a.click();
  } catch (e) { if (e.message !== 'unauthorized') showFlash(e.message, true); }
}

function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function escapeAttr(s) { return escapeHtml(s); }

document.getElementById('secretInput').addEventListener('keydown', e => { if (e.key === 'Enter') signIn(); });
</script>
</body>
</html>
